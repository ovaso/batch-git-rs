name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag name
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          test "${RELEASE_TAG#v}" != "$RELEASE_TAG"
          git check-ref-format "refs/tags/${RELEASE_TAG}"
          printf 'value=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Verify tag exists in this repository
        shell: bash
        run: >-
          git ls-remote --exit-code --tags
          "https://github.com/${GITHUB_REPOSITORY}.git"
          "refs/tags/${RELEASE_TAG}"
      - name: Verify release does not already exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release ${RELEASE_TAG} already exists" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.value }}
      - name: Verify tag matches package version
        shell: bash
        run: >-
          test
          "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          = "$RELEASE_TAG"

  build:
    name: Package (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: batch-git
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: batch-git
          - os: macos-15
            target: aarch64-apple-darwin
            binary: batch-git
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: batch-git.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Inspect Linux dynamic dependencies
        if: runner.os == 'Linux'
        run: ldd target/${{ matrix.target }}/release/${{ matrix.binary }}
      - name: Inspect macOS dynamic dependencies
        if: runner.os == 'macOS'
        run: otool -L target/${{ matrix.target }}/release/${{ matrix.binary }}
      - name: Package archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package/completions
          archive="batch-git-${{ matrix.target }}.tar.gz"
          package="batch-git-${{ matrix.target }}"
          mv dist/package "dist/${package}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${package}/"
          cp LICENSE README.md README.zh-CN.md "dist/${package}/"
          cp completions/* "dist/${package}/completions/"
          tar -C dist -czf "dist/${archive}" "${package}"
          if command -v sha256sum >/dev/null; then
            checksum=$(sha256sum "dist/${archive}" | awk '{print $1}')
          else
            checksum=$(shasum -a 256 "dist/${archive}" | awk '{print $1}')
          fi
          printf '%s  %s\n' "$checksum" "$archive" > "dist/${archive}.sha256"
          rm -rf "dist/${package}"
      - uses: actions/upload-artifact@v7
        with:
          name: batch-git-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create combined checksums and include installers
        shell: bash
        run: |
          set -euo pipefail
          cp install.sh install.ps1 dist/
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Attest release archives
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes
