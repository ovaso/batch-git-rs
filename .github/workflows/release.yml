name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: batch-git
          - os: macos-13
            target: x86_64-apple-darwin
            binary: batch-git
          - os: macos-14
            target: aarch64-apple-darwin
            binary: batch-git
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: batch-git.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package/completions
          archive="batch-git-${{ matrix.target }}.tar.gz"
          package="batch-git-${{ matrix.target }}"
          mv dist/package "dist/${package}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${package}/"
          cp LICENSE README.md "dist/${package}/"
          cp completions/* "dist/${package}/completions/"
          tar -C dist -czf "dist/${archive}" "${package}"
          if command -v sha256sum >/dev/null; then
            checksum=$(sha256sum "dist/${archive}" | awk '{print $1}')
          else
            checksum=$(shasum -a 256 "dist/${archive}" | awk '{print $1}')
          fi
          printf '%s  %s\n' "$checksum" "$archive" > "dist/${archive}.sha256"
          rm -rf "dist/${package}"
      - uses: actions/upload-artifact@v4
        with:
          name: batch-git-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify tag matches package version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: test "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" = "$TAG"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create combined checksums and include installers
        shell: bash
        run: |
          set -euo pipefail
          cp install.sh install.ps1 dist/
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Attest release archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes
