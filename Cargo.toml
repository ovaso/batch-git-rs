[package]
name = "batch-git"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
console = "0.16"
fs2 = "0.4"
git2 = "0.20"
indicatif = "0.18"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
url = "2"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
