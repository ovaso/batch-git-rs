[package]
name = "batch-git"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Safe, declarative management of workspaces containing multiple Git repositories"
readme = "README.md"
repository = "https://github.com/livenv/batch-git"
homepage = "https://github.com/livenv/batch-git"
documentation = "https://github.com/livenv/batch-git/tree/main/docs"
keywords = ["git", "workspace", "monorepo", "automation", "cli"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"
include = [
    "src/**",
    "tests/**",
    "docs/**",
    "skills/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "build.sh",
]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
console = "0.16"
fs2 = "0.4"
git2 = { version = "0.21", default-features = false }
indicatif = "0.18"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
url = "2"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
